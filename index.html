<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Gradebook</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 2em auto; padding: 0 1em; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  input[type=number] { width: 5em; }
  .err { color: #b00; } .ok { color: #070; }
</style>
</head>
<body>
<h1>Teacher Gradebook</h1>

<div id="login" hidden>
  <form id="loginForm">
    <p><input id="email" type="email" placeholder="Email" required></p>
    <p><input id="password" type="password" placeholder="Password" required></p>
    <button type="submit">Log in</button>
  </form>
  <p>Test accounts: <code>teacher1@school.test</code> / <code>teacher1pass</code>,
     <code>teacher2@school.test</code> / <code>teacher2pass</code></p>
</div>

<div id="app" hidden>
  <p>Logged in as <b id="who"></b> <button id="logout">Log out</button></p>
  <table>
    <thead><tr><th>Student</th><th>Subject</th><th>Grade (0-100)</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<p id="msg"></p>

<script>
// All data goes through our backend API (Cloudflare Worker), which talks to the database.
const API = 'https://teacher-grade-api.aniascapital.workers.dev/api/';
const $ = id => document.getElementById(id);

async function api(method, path, body, token) {
  const r = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await r.text();
  const data = text ? JSON.parse(text) : null;
  if (!r.ok) throw new Error((data && data.message) || r.statusText);
  return data;
}

function msg(text, cls) { $('msg').textContent = text; $('msg').className = cls || ''; }
function session() { try { return JSON.parse(localStorage.getItem('gb_session')); } catch (e) { return null; } }
function showLogin() { $('login').hidden = false; $('app').hidden = true; $('rows').innerHTML = ''; }

async function showApp() {
  const s = session();
  if (!s) return showLogin();
  try {
    const students = await api('GET', 'students', null, s.token);
    $('who').textContent = s.name + ' (' + s.email + ')';
    $('rows').innerHTML = '';
    for (const st of students) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td></td><td></td><td><input type="number" min="0" max="100" step="1"></td><td><button>Save</button></td>';
      tr.cells[0].textContent = st.name;
      tr.cells[1].textContent = st.subject;
      const input = tr.querySelector('input');
      input.value = st.grade ?? '';
      tr.querySelector('button').onclick = async () => {
        const grade = input.value === '' ? null : Number(input.value);
        try {
          await api('PUT', 'students/' + st.id + '/grade', { grade }, s.token);
          msg('Saved ' + st.name + ': ' + grade, 'ok');
        } catch (e) {
          msg(e.message, 'err');
          if (e.message === 'Not logged in') { localStorage.removeItem('gb_session'); showLogin(); }
        }
      };
      $('rows').appendChild(tr);
    }
    $('login').hidden = true;
    $('app').hidden = false;
  } catch (e) {
    localStorage.removeItem('gb_session');
    msg(e.message, 'err');
    showLogin();
  }
}

$('loginForm').onsubmit = async ev => {
  ev.preventDefault();
  try {
    const s = await api('POST', 'login', { email: $('email').value, password: $('password').value });
    localStorage.setItem('gb_session', JSON.stringify(s));
    $('password').value = '';
    msg('');
    await showApp();
  } catch (e) { msg(e.message, 'err'); }
};

$('logout').onclick = async () => {
  const s = session();
  localStorage.removeItem('gb_session');
  showLogin();
  msg('Logged out', 'ok');
  if (s) try { await api('POST', 'logout', null, s.token); } catch (e) {}
};

showApp();
</script>
</body>
</html>
